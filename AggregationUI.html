<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: sans-serif; padding: 20px; color: #333; }
      .field { margin-bottom: 15px; }
      label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
      input[type="month"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
      button { width: 100%; padding: 10px; background-color: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
      button:hover { background-color: #1557b0; }
    </style>
  </head>
  <body>
    <h3>📅 期間を指定して集計</h3>
    <div class="field">
      <label for="targetMonth">集計対象月を選択</label>
      <input type="month" id="targetMonth">
    </div>
    <button onclick="startAggregation()">集集計を実行</button>

    <script>
      function startAggregation() {
        const monthVal = document.getElementById('targetMonth').value;
        if (!monthVal) {
          alert('対象月を選択してください。');
          return;
        }
        // yyyy-mm を yyyy/mm/01 に変換してGASに渡す
        const startStr = monthVal.replace('-', '/') + '/01';
        google.script.run
          .withSuccessHandler(() => {
            google.script.host.close();
          })
          .withFailureHandler((err) => {
            alert('エラーが発生しました: ' + err.message);
          })
          .processAggregationFromDialog(startStr, startStr);
      }
    </script>
  </body>
</html>
